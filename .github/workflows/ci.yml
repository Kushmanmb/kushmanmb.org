name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Security: Restrict permissions to minimum required
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run verification tests
      run: npm run test:verify
      continue-on-error: true
      # Verification tests may fail in CI without proper environment setup (API keys, etc.)

    - name: Run faucet tests
      run: npm run test:faucet
      continue-on-error: true
      # Faucet tests may fail in CI without proper environment setup (private keys, RPC, etc.)

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build with build script
      run: npm run build

    - name: Build with Webpack
      run: npm run webpack

    - name: Verify build artifacts exist
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist directory not created"
          exit 1
        fi
        echo "Build artifacts created successfully"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.node-version == '20.x'
      with:
        name: dist-files
        path: dist/
        retention-days: 7
        if-no-files-found: error

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for secrets in code
      run: |
        # Check for potential secrets or sensitive data patterns
        echo "Checking for potential secrets..."
        # Look for assignment patterns with quoted strings that might be secrets
        # Excludes test and example directories where placeholder secrets are expected
        if grep -r -n -E "(private[_-]?key|api[_-]?key|secret[_-]?key|password)\s*[:=]\s*['\"][^'\"]{8,}" \
          --include="*.js" --include="*.ts" \
          --exclude-dir=node_modules \
          --exclude-dir=test \
          --exclude-dir=tests \
          --exclude-dir=__tests__ \
          --exclude-dir=examples \
          --exclude=package-lock.json .; then
          echo "⚠️  Warning: Potential secrets found in code"
          echo "Please review the matches above and ensure no actual secrets are committed"
          echo "Note: Consider using a dedicated tool like Gitleaks for comprehensive scanning"
        else
          echo "✓ No obvious secret patterns found"
        fi
