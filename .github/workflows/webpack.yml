name: Webpack Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Security: Restrict permissions to minimum required
permissions:
  contents: read

jobs:
  build:
    name: Webpack Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false

    steps:
    - name: Validate Repository Owner
      run: |
        ALLOWED_OWNERS=("kushmanmb-org" "kushmanmb")
        REPO_OWNER="${{ github.repository_owner }}"
        
        if [[ ! " ${ALLOWED_OWNERS[@]} " =~ " ${REPO_OWNER} " ]]; then
          echo "❌ Error: This workflow can only run in repositories owned by: ${ALLOWED_OWNERS[@]}"
          echo "Current repository owner: ${REPO_OWNER}"
          exit 1
        fi
        echo "✓ Repository owner validation passed: ${REPO_OWNER}"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build with Webpack
      run: npm run webpack

    - name: Verify webpack output
      run: |
        if [ -d "dist" ]; then
          echo "✓ Webpack build successful"
          echo "Build artifacts:"
          ls -lh dist/
        else
          echo "✗ Webpack build failed - no dist directory"
          exit 1
        fi
